server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/octet-stream model/gltf-binary image/svg+xml;

  location / { 
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri /index.html; 
  }

  location /assets/ {
    expires off;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* ^/assets/.+-[A-Za-z0-9]{8,}\.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|glb|gltf)$ {
    expires off;
    add_header Cache-Control "no-cache";
    access_log off;
  }
}
