services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whoisai
      POSTGRES_USER: whoisai
      POSTGRES_PASSWORD: whoisai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoisai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - whoisai_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      SERVER_PORT: 8787
      DATABASE_URL: postgres://whoisai:whoisai@postgres:5432/whoisai
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_POPULATION: ${AI_POPULATION:-18}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  whoisai_pg:
